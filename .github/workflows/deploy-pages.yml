name: Build and deploy Godot game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Godot and web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run Godot tests
        timeout-minutes: 15
        run: |
          run_test() {
            expected="$1"
            shift
            set +e
            output=$(timeout --kill-after=10s 240s godot "$@" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ] || echo "$output" | grep -Eq 'SCRIPT ERROR|^ERROR:'; then
              return 1
            fi
            if ! echo "$output" | grep -Fq "$expected"; then
              echo "Missing test completion marker: $expected"
              return 1
            fi
          }
          run_test 'RaceConfig tests passed' --headless --path . tests/TestRaceConfig.tscn
          run_test 'Kart mechanics tests passed' --headless --path . tests/TestKartMechanics.tscn
          run_test 'Main configuration tests passed' --headless --path . tests/TestMainConfiguration.tscn
          run_test 'RaceManager tests passed' --headless --path . --script tests/test_race_manager.gd
          run_test 'Circuit geometry, grid, item, recovery, and restart tests passed' --headless --path . tests/TestCircuitGeometry.tscn
          run_test 'Circuit integration tests passed' --headless --path . --fixed-fps 60 tests/TestCircuitIntegration.tscn

      - name: Export game for the web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll

      - name: Install Web smoke dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test exported game
        run: npm run test:web

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-diagnostics
          path: |
            .artifacts/playwright-report
            .artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

